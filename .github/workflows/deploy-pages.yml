name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: '24.x'
  # Project Pages URL for aliyun/alibabacloud-maxcompute-docs.
  # Replace these two values if a custom domain is configured.
  DOCS_SITE_URL: https://aliyun.github.io
  DOCS_BASE_URL: /alibabacloud-maxcompute-docs/

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          cache: npm

      - name: Install dependencies
        # The lockfile is also used by internal CI; use the public registry on GitHub runners.
        run: npm ci --registry=https://registry.npmjs.org --no-audit --no-fund

      - name: Validate and build website
        run: npm run ci

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
