workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - validate
  - build

default:
  image: node:24.12.0-bookworm-slim
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit

validate:
  stage: validate
  script:
    - npm run validate

build:
  stage: build
  needs:
    - validate
  script:
    - npm run build
  artifacts:
    name: 'maxcompute-docs-$CI_COMMIT_SHORT_SHA'
    expire_in: 7 days
    paths:
      - build/
